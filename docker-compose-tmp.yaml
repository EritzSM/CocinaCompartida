services:
    db:
        image: postgres:15-alpine
        container_name: cocina_compartida_db
        restart: always
        environment:
            POSTGRES_USER: ${DB_USER:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
            POSTGRES_DB: ${DB_NAME:-cocina_compartida_db}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-cocina_compartida_db}"]
            interval: 10s
            timeout: 5s
            retries: 5
    backend:
        build:
            context: ./cocina-compartida-api
            dockerfile: Dockerfile
        container_name: cocina_compartida_backend
        restart: always
        environment:
            - DB_HOST=db
            - DB_PORT=5432
            - DB_USER=${DB_USER:-postgres}
            - DB_PASSWORD=${DB_PASSWORD:-postgres}
            - DB_NAME=${DB_NAME:-cocina_compartida_db}
            - DB_SSL=false
            - JWT_SECRET=${JWT_SECRET:-your_super_secret_jwt_key}
            - NODE_EXTRA_CA_CERTS=/tmp/keploy-tls/ca.crt
            - REQUESTS_CA_BUNDLE=/tmp/keploy-tls/ca.crt
            - SSL_CERT_FILE=/tmp/keploy-tls/ca.crt
            - CARGO_HTTP_CAINFO=/tmp/keploy-tls/ca.crt
            - JAVA_TOOL_OPTIONS=-Djavax.net.ssl.trustStore=/tmp/keploy-tls/truststore.jks -Djavax.net.ssl.trustStorePassword=changeit
        volumes:
            - uploads_data:/usr/src/app/uploads
            - keploy-tls-certs:/tmp/keploy-tls:ro
        depends_on:
            keploy-agent:
                condition: service_healthy
            db:
                condition: service_healthy
        pid: service:keploy-agent
        network_mode: service:keploy-agent
    frontend:
        build:
            context: ./cocina-compartida
            dockerfile: Dockerfile
        container_name: cocina_compartida_frontend
        restart: always
        ports:
            - "80:80"
        depends_on:
            - backend
    keploy-agent:
        image: docker.io/keploy/enterprise:v3.5.22
        container_name: keploy-v3-af29
        # Capabilities required by keploy-agent for eBPF interception.
        # Review and allow only what your security policy permits.
        cap_add:
            - BPF
            - PERFMON
            - NET_ADMIN # required for network traffic capture (scoped to container's own namespace)
            - SYS_RESOURCE
            - SYS_PTRACE
            - SYS_NICE
        environment:
            - BINARY_TO_DOCKER=true
            - CERT_EXPORT_PATH=/tmp/keploy-tls
            - KEPLOY_DEBUG_FILE=/keploy-host/agent-debug.log
        ports:
            - "34739:34739"
            - "16789:16789"
            - "3000:3000"
        networks:
            default:
                aliases:
                    - backend
        volumes:
            - /sys/fs/cgroup:/sys/fs/cgroup
            - /sys/kernel/debug:/sys/kernel/debug
            - /sys/fs/bpf:/sys/fs/bpf
            - keploy-tls-certs:/tmp/keploy-tls
            - /mnt/c/Users/User/Documents/Programacion/Desarrollo_web/CocinaCompartida/keploy:/keploy-host
        command:
            - --port
            - "34739"
            - --proxy-port
            - "16789"
            - --dns-port
            - "26789"
            - --client-pid
            - "10079"
            - --mode
            - test
            - --is-docker
            - --disable-mapping=true
            - --enable-testing
            - --config-path
            - /mnt/c/Users/User/Documents/Programacion/Desarrollo_web/CocinaCompartida
            - --build-delay
            - "30"
        healthcheck:
            test:
                - CMD-SHELL
                - cat /tmp/agent.ready
            interval: 5s
            timeout: 5s
            retries: 60
            start_period: 10s
volumes:
    postgres_data:
    uploads_data:
    keploy-tls-certs: {}
